[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aigis-sast"
version = "0.3.0"
description = "AigisSAST: security scanner for AI-generated code. Finds what vibe coding leaves behind and explains how to fix it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "jasperBLCK" }]
keywords = ["security", "sast", "linter", "secrets", "ai", "vibe-coding", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aigis = "aigis.cli:main"

[project.urls]
Homepage = "https://github.com/jasperBLCK/AigisSAST"
Source = "https://github.com/jasperBLCK/AigisSAST"
Issues = "https://github.com/jasperBLCK/AigisSAST/issues"
Changelog = "https://github.com/jasperBLCK/AigisSAST/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
